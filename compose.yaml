# Local development. See README.md: `docker compose up -d --build`, then the API is on http://localhost:8000.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: choronai
      POSTGRES_USER: choronai
      POSTGRES_PASSWORD: choronai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choronai"]
      interval: 3s
      retries: 20

  api:
    build: docker
    # Run as your own user so files created in the container (logs, vendor/) stay yours.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    depends_on:
      db:
        condition: service_healthy

  # Database in the browser (like phpMyAdmin): http://localhost:8080
  # System PostgreSQL, server db, user/password/database choronai.
  # Bound to 127.0.0.1, so only this computer can open it.
  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      # Light theme like phpMyAdmin (the default follows the computer's dark mode).
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - db

volumes:
  pgdata:
