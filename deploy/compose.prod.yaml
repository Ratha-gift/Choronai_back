# Production: everything on one server.
#   cd Choronai-backend
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.production up -d --build
# The frontend repo must be next to this one: ../Choronai-front (see deploy/README.md).
name: choronai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ../../Choronai-front
    restart: unless-stopped
    environment:
      CHORONAI_WORKSPACE: laravel
      CHORONAI_API_URL: http://web:8080/api/v1
    volumes:
      - front:/data
    depends_on: [api]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [front, api]

volumes:
  db:
  front:
  caddy_data:
  caddy_config:
